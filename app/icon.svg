<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="GAS ELECTRONIC">
  <!-- face -->
  <rect width="32" height="32" fill="#c0c0c0"/>
  <!-- bevel 3D -->
  <rect x="0" y="0" width="32" height="2" fill="#ffffff"/>
  <rect x="0" y="0" width="2" height="32" fill="#ffffff"/>
  <rect x="30" y="0" width="2" height="32" fill="#808080"/>
  <rect x="0" y="30" width="32" height="2" fill="#808080"/>
  <rect x="2" y="2" width="2" height="28" fill="#dfdfdf"/>
  <rect x="2" y="2" width="28" height="2" fill="#dfdfdf"/>
  <rect x="28" y="2" width="2" height="28" fill="#404040"/>
  <rect x="2" y="28" width="28" height="2" fill="#404040"/>
  <!-- windows flag: 4 quadrants -->
  <rect x="6" y="6" width="10" height="10" fill="#e73e3e"/>
  <rect x="16" y="6" width="10" height="10" fill="#2e8b57"/>
  <rect x="6" y="16" width="10" height="10" fill="#2e6fd8"/>
  <rect x="16" y="16" width="10" height="10" fill="#f5c518"/>
  <!-- cross divider -->
  <rect x="6" y="15" width="20" height="2" fill="#000000"/>
  <rect x="15" y="6" width="2" height="20" fill="#000000"/>
</svg>
