name: Deploy Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.ENABLE_WINDOWS_DEPLOY == 'true'
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        shell: powershell
        run: ./scripts/deploy-windows.ps1
        env:
          SERVER_PATH: ${{ vars.SERVER_PATH }}
