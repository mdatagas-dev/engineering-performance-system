name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      - run: npx tsx --test "lib/i18n/*.test.ts"
